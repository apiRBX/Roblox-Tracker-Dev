<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox API Changelog - 0.732.0.7321040</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #11151c;
      --text-color: #adbac7;
      --border-color: #21262d;

      --verb-add: #00e676;
      --verb-change: #e0e0e0;
      --verb-remove: #ff5252;
      --verb-update: #82aaff;

      --kw-class: #f06292;
      --kw-property: #00bcd4;
      --kw-function: #4caf50;
      --kw-event: #ff9800;
      --kw-callback: #ab47bc;
      --kw-enum: #ff5722;
      --kw-enumitem: #ff7043;

      --tok-type: #f97583;
      --tok-enum: #ff9800;
      --code-color: #79c0ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      font-size: 13px;
      line-height: 1.6;
    }
    .container { width: 100%; max-width: 1200px; }
    
    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0 0 1rem 0; font-size: 1.4rem; color: #f0f6fc; }
    
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      font-size: 0.85rem;
    }
    .meta-item { display: flex; flex-direction: column; }
    .meta-label { color: #768390; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; margin-bottom: 4px; }
    .meta-value { font-family: monospace; color: #f0f6fc; }
    
    a { color: var(--code-color); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .changelog-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .changelog-card h2 {
      margin-top: 0;
      color: #f0f6fc;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    ul.changelog-list { list-style-type: none; padding-left: 0; margin: 0; }
    ul.changelog-list li {
      padding: 0.2rem 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "Liberation Mono", Monaco, monospace;
    }
    
    ul.changelog-list li.section-header {
      margin-top: 0.8rem !important;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }

    /* Verbs */
    .verb { font-weight: bold; margin-right: 4px; }
    .verb-add { color: var(--verb-add); }
    .verb-change { color: var(--verb-change); font-style: italic; }
    .verb-remove { color: var(--verb-remove); }
    .verb-update { color: var(--verb-update); }

    /* Keywords */
    .kw { font-weight: bold; margin-right: 2px; }
    .kw-class { color: var(--kw-class); }
    .kw-property { color: var(--kw-property); }
    .kw-function { color: var(--kw-function); }
    .kw-event { color: var(--kw-event); }
    .kw-callback { color: var(--kw-callback); }
    .kw-enum { color: var(--kw-enum); }
    .kw-enumitem { color: var(--kw-enumitem); }

    /* Types & Enums */
    .tok-type { color: var(--tok-type); }
    .tok-enum { color: var(--tok-enum); }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.05em 0.45em;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      margin: 0 2px;
    }
    .badge-security { background-color: rgba(248, 81, 73, 0.15); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }
    .badge-tag { background-color: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
    .badge-capability { background-color: rgba(189, 147, 249, 0.15); color: #d2a8ff; border: 1px solid rgba(189, 147, 249, 0.4); }
    .badge-serialization { background-color: rgba(88, 166, 255, 0.15); color: #79c0ff; border: 1px solid rgba(88, 166, 255, 0.4); }

    code { color: var(--code-color); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Roblox API Tracker</h1>
      <div class="meta-grid">
        <div class="meta-item">
          <span class="meta-label">Client Version</span>
          <span class="meta-value"><code>0.732.0.7321040</code></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Version Hash</span>
          <span class="meta-value"><code>version-ff6341faef444107</code></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Official Release Notes</span>
          <a href="https://create.roblox.com/docs/release-notes/release-notes-732" target="_blank" rel="noopener">Release Notes 732 ↗</a>
        </div>
      </div>
    </header>

    <main class="changelog-card">
      <h2>API Differences</h2>
      <ul class="changelog-list">
        <li class="root-item " style="margin-left: 0px;">_No API changes detected in this build._</li>
      </ul>
    </main>
  </div>
</body>
</html>
